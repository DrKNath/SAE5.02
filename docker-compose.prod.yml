# Environnement de PRODUCTION / demo.
# Usage : docker compose -f docker-compose.prod.yml up --build
#
# Image buildee (pas de hot reload, pas de source montee) : c'est cette
# configuration qui correspond a l'"image Docker permettant de lancer"
# le projet demandee dans le sujet.

services:
  app:
    build:
      context: .
      target: prod
    # Pour utiliser l'image publiee sur le registry au lieu de rebuilder :
    # image: ghcr.io/<org>/<repo>:latest
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: file:/app/data/prod.db
      NODE_ENV: production
    volumes:
      - sqlite_data:/app/data
      - uploads_data:/app/uploads
    restart: unless-stopped

volumes:
  sqlite_data:
  uploads_data:
